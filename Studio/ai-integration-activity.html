<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer AI Studio — 8 Lenses</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}
:root{--or:#E84A27;--bl:#13294B;--or-mid:#f26644;--bl2:#1d3d6b}

header{background:var(--bl);padding:1rem 1.5rem;display:flex;align-items:center;gap:12px}
.logo{background:var(--or);color:#fff;font-size:11px;font-weight:700;padding:5px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px;line-height:1.3;flex-shrink:0}
.header-text h1{font-size:17px;font-weight:600;color:#fff}
.header-text p{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}

.shell{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:220px;flex-shrink:0;background:#fff;border-right:1px solid #ddd;padding:1rem 0;position:sticky;top:0;height:calc(100vh - 56px);overflow-y:auto}
.sidebar-title{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:1px;padding:0 1rem .5rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 1rem;cursor:pointer;border-left:3px solid transparent;font-size:13px;color:#444;transition:all .15s;line-height:1.3}
.nav-item:hover{background:#f5f5f5}
.nav-item.active{border-left-color:var(--or);background:#fdf1ed;color:var(--or);font-weight:600}
.nav-item.done .nav-dot{background:var(--bl);border-color:var(--bl)}
.nav-item.active .nav-dot{background:var(--or);border-color:var(--or)}
.nav-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #ccc;flex-shrink:0;transition:all .15s}

.content{flex:1;padding:1.75rem;max-width:720px}

.lens-panel{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:1.5rem}
.lens-header{background:var(--bl);padding:1.1rem 1.5rem}
.lens-header .ln{font-size:11px;color:rgba(255,255,255,.55);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px}
.lens-header h2{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px}
.lens-header .purpose{font-size:13px;color:rgba(255,255,255,.72);line-height:1.5}
.lens-body{padding:1.5rem}

.why-box{background:#f5f5f5;border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.5rem;font-size:13px;color:#444;line-height:1.6;border-left:3px solid var(--bl)}

/* doc tip box */
.doc-tip{background:#fff;border:1px solid #d0d0d0;border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;gap:10px;align-items:flex-start}
.doc-tip-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.doc-tip-body h4{font-size:13px;font-weight:700;color:var(--bl);margin-bottom:.3rem}
.doc-tip-body p{font-size:12px;color:#555;line-height:1.55}
.doc-tip-body strong{color:#1a1a1a}

.prompts-label{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.8px;margin-bottom:.5rem}
.prompts-intro{font-size:12px;color:#777;margin-bottom:.9rem;line-height:1.5}

.prompt-card{border:1px solid #ddd;border-radius:8px;margin-bottom:.75rem;overflow:hidden}
.prompt-card-header{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1rem;background:#f7f7f7;border-bottom:1px solid #e8e8e8;gap:8px}
.prompt-card.special .prompt-card-header{background:var(--bl);border-bottom-color:rgba(255,255,255,.15)}
.prompt-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
/* standard tags — monochrome */
.tag-starter{background:#e8e8e8;color:#333}
.tag-deeper{background:#e8e8e8;color:#333}
.tag-critical{background:#333;color:#fff}
/* pattern tags — Illinois orange accent on dark header */
.tag-flipped{background:var(--or);color:#fff}
.tag-persona{background:var(--or);color:#fff}
.tag-reversal{background:var(--or);color:#fff}
.tag-steelman{background:var(--or);color:#fff}
.tag-iterative{background:var(--or);color:#fff}
.tag-constraint{background:var(--or);color:#fff}

.prompt-text{padding:.9rem 1rem;font-size:13px;color:#333;line-height:1.65;white-space:pre-wrap;background:#fff}
.prompt-note{font-size:12px;border-top:1px solid #eee;padding:.65rem 1rem;line-height:1.55;display:flex;gap:7px;align-items:flex-start;background:#f7f7f7;color:#555}
.prompt-note strong{color:#1a1a1a}

.btn-row{display:flex;gap:6px;flex-shrink:0}
.copy-btn{padding:4px 11px;border:1px solid #bbb;border-radius:5px;background:#fff;font-size:12px;font-weight:600;color:#444;cursor:pointer;transition:all .15s;white-space:nowrap}
.copy-btn:hover{background:var(--bl);color:#fff;border-color:var(--bl)}
.copy-btn.copied{background:var(--bl);color:#fff;border-color:var(--bl)}
/* copy btn on dark header */
.prompt-card.special .copy-btn{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.prompt-card.special .copy-btn:hover,.prompt-card.special .copy-btn.copied{background:var(--or);border-color:var(--or);color:#fff}

.try-it{background:var(--bl);border-radius:8px;padding:1.1rem 1.25rem;margin:1.5rem 0}
.try-it h4{font-size:13px;font-weight:700;color:#fff;margin-bottom:.4rem}
.try-it p{font-size:13px;color:rgba(255,255,255,.8);line-height:1.6}
.tool-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:.6rem}
.tool-chip{font-size:12px;padding:3px 10px;border-radius:12px;background:transparent;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.9);font-weight:600;text-decoration:none;transition:all .15s}
.tool-chip:hover{background:var(--or);border-color:var(--or);color:#fff}

.insight-section{margin-top:1.5rem}
.insight-section label{display:block;font-size:13px;font-weight:700;color:#333;margin-bottom:.4rem}
.insight-section p{font-size:12px;color:#777;margin-bottom:.6rem;line-height:1.5}
.insight-textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a1a;background:#fafafa;resize:vertical;transition:border-color .2s}
.insight-textarea:focus{outline:none;border-color:var(--or);background:#fff}
.save-btn{margin-top:.6rem;padding:8px 18px;border-radius:6px;background:var(--or);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.save-btn:hover{background:var(--or-mid)}

.nav-footer{display:flex;justify-content:space-between;margin-top:1rem}
.nav-btn{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #ccc;background:#fff;color:#444;font-family:inherit;transition:all .15s}
.nav-btn:hover{border-color:var(--bl);color:var(--bl)}
.nav-btn.primary{background:var(--bl);color:#fff;border-color:var(--bl)}
.nav-btn.primary:hover{background:var(--bl2)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}

.report-card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:1.25rem}
.report-head{background:var(--bl);padding:1rem 1.5rem;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.report-head span{font-size:15px;font-weight:700}
.report-copy-btn{padding:6px 14px;border-radius:6px;background:var(--or);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
.report-copy-btn:hover{background:var(--or-mid)}
.report-copy-btn.copied{background:#2a5a2a}
.report-body{padding:1.5rem}
.report-item{border-bottom:1px solid #eee;padding-bottom:1.25rem;margin-bottom:1.25rem}
.report-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.report-lens-name{font-size:13px;font-weight:700;color:var(--bl);margin-bottom:.4rem}
.report-insight{font-size:14px;color:#333;line-height:1.6;white-space:pre-wrap}
.empty-report{text-align:center;padding:2.5rem;color:#aaa;font-size:14px}

.prog-bar-wrap{background:#fff;border:1px solid #ddd;border-radius:8px;padding:.9rem 1.1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:12px}
.prog-bar{flex:1;background:#e5e5e5;border-radius:4px;height:7px;overflow:hidden}
.prog-fill{background:var(--or);height:100%;border-radius:4px;transition:width .4s}
.prog-label{font-size:13px;color:#666;white-space:nowrap}
.copy-all-hint{font-size:12px;color:#555;margin-bottom:1rem;line-height:1.6;padding:.75rem 1rem;background:#fff;border:1px solid #ddd;border-radius:8px}

@media(max-width:640px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;padding:.5rem}
  .nav-item{border-left:none;border-bottom:2px solid transparent;padding:6px 8px;font-size:12px}
  .nav-item.active{border-bottom-color:var(--or);border-left-color:transparent;background:none}
  .content{padding:1rem}
}
</style>
</head>
<body>
<header>
  <div class="logo">Summer<br>AI Studio</div>
  <div class="header-text">
    <h1>8 Lenses for AI Integration</h1>
    <p>Prompting Activities for Faculty — University of Illinois</p>
  </div>
</header>
<div class="shell">
  <nav class="sidebar">
    <div class="sidebar-title">Lenses</div>
    <div id="nav-items"></div>
    <div style="margin-top:1rem;border-top:1px solid #eee;padding-top:.75rem">
      <div class="nav-item" id="nav-report" onclick="showReport()">
        <span class="nav-dot"></span><span>📋 Report out</span>
      </div>
    </div>
  </nav>
  <div class="content" id="main-content"></div>
</div>
<script>
const TOOLS=[
  {name:'ChatGPT',url:'https://chatgpt.com'},
  {name:'Gemini',url:'https://gemini.google.com'},
  {name:'Claude',url:'https://claude.ai'},
  {name:'Copilot',url:'https://copilot.microsoft.com'},
  {name:'Perplexity',url:'https://www.perplexity.ai'}
];

const TAG_META={
  starter:   {cls:'tag-starter',  label:'Starter',      special:false, note:null},
  deeper:    {cls:'tag-deeper',   label:'Go deeper',    special:false, note:null},
  critical:  {cls:'tag-critical', label:'Push it',      special:false, note:null},
  flipped:   {cls:'tag-flipped',  label:'↩ Flipped',    special:true,  note:'<strong>Flipped prompt:</strong> paste this in and the AI will interview <em>you</em>, one question at a time. Respond naturally and let it lead — don\'t ask it to summarize until you\'re ready.'},
  persona:   {cls:'tag-persona',  label:'👤 Persona',   special:true,  note:'<strong>Persona prompt:</strong> the AI responds from a specific role or perspective. The shift in viewpoint surfaces concerns a neutral assistant tends to smooth over.'},
  reversal:  {cls:'tag-reversal', label:'🔄 Role reversal',special:true,note:'<strong>Role reversal:</strong> the AI takes the student\'s perspective and tries to complete or game the assignment. What it produces reveals design gaps you can\'t easily see from the instructor\'s side.'},
  steelman:  {cls:'tag-steelman', label:'⚖️ Steelman',  special:true,  note:'<strong>Steelman prompt:</strong> the AI makes the strongest possible case for a position — even one you resist. Use it to pressure-test your own reasoning before you commit to a decision.'},
  iterative: {cls:'tag-iterative',label:'🔁 Iterative', special:true,  note:'<strong>Iterative refinement:</strong> a two-step prompt. Run the first instruction, then feed the AI\'s response back in with the follow-up instruction shown. Best used in the same conversation window.'},
  constraint:{cls:'tag-constraint',label:'🔒 Constraint',special:true, note:'<strong>Constraint prompt:</strong> the AI must follow a rule while responding. Constraints force more targeted, creative output and prevent the AI from defaulting to safe generalities.'},
};

// docTip: appears on 3 lenses to guide document upload directly in the AI tool
const DOC_TIPS={
  assignment:{
    icon:'📄',
    title:'Bring your assignment into the AI tool',
    body:'Before trying the prompts below, open your AI tool of choice and upload or paste your existing assignment prompt. Most tools (ChatGPT, Claude, Gemini) accept file uploads or pasted text. Once it\'s loaded, add the prompt — the AI will use your actual assignment as context.'
  },
  objectives:{
    icon:'🎯',
    title:'Bring your learning objectives into the AI tool',
    body:'Before trying the prompts below, open your AI tool and paste or upload your course learning objectives. You can copy them from your syllabus, LMS, or course design document. Adding them gives the AI specific goals to work with rather than guessing at your intent.'
  },
  syllabus:{
    icon:'📋',
    title:'Bring your syllabus into the AI tool',
    body:'Before trying the prompts below, open your AI tool and upload your syllabus — or paste the most relevant section (course description, policies, major assignments). Most tools accept PDF or Word uploads directly. This gives the AI real context about your course structure and expectations.'
  }
};

const LENSES=[
  {
    id:'objectives',title:'Course objectives',
    purpose:'Ensure AI use serves learning goals rather than driving them.',
    docTip:'objectives',
    why:`Before inviting AI into an assignment, it's worth asking: does this help students <strong>achieve</strong> the learning goal, or does it let them bypass it? This lens helps you map the relationship between AI capabilities and what you actually want students to learn.`,
    prompts:[
      {tag:'starter',  text:`Considering all of the capabilities of generative AI systems today, how might I integrate AI in a meaningful way in my course — specifically in ways that genuinely support my students in achieving their learning objectives, rather than replacing the thinking I want them to do?`},
      {tag:'flipped',  text:`I want to think carefully about whether and how to integrate AI into a course assignment. I'd like you to help me work through this by asking me one question at a time — wait for my answer before asking the next. Start by asking me what the assignment is, then use my answers to probe how AI might support or undermine what I want students to learn. Don't give me your analysis until I ask for it. Begin with your first question now.`},
      {tag:'persona',  text:`I'm considering integrating AI into a learning objective in my course. Respond as a skeptical faculty colleague in my discipline who has serious reservations about AI in higher education. Ask me the hardest questions you'd want answered before you'd feel comfortable with this integration. Be direct and don't soften your concerns.`},
    ],
    tryIt:`Try the flipped prompt first — let the AI interview you before it offers analysis. Then try the persona prompt and notice how a skeptical "colleague" surfaces different concerns than a neutral assistant.`,
    insightPrompt:`What surprised you? Did the AI identify alignment issues or bypass risks you hadn't considered?`
  },
  {
    id:'engagement',title:'Student engagement',
    purpose:'Examine how much cognitive work students actually retain.',
    docTip:'assignment',
    why:`When AI does the heavy lifting, students can produce polished work without doing the underlying thinking. This lens asks: who is actually doing the intellectual work — the student or the model?`,
    prompts:[
      {tag:'starter',  text:`Considering all of the capabilities of generative AI systems today, how might I integrate AI meaningfully in my course in a way that keeps students intellectually engaged — ensuring they are doing the thinking, analyzing, and sense-making rather than offloading it to AI?`},
      {tag:'reversal', text:`I'm going to describe a course assignment. I want you to respond as a resourceful student whose goal is to complete it with as little original thinking as possible using AI tools. Walk me through exactly how you'd approach it, step by step. Be honest about where AI does the work and where you'd have to think for yourself. Here is the assignment: [paste or describe your assignment — or upload it to this tool first].`},
      {tag:'iterative',text:`Here is a draft assignment prompt I use in my course: [paste your assignment]. First, identify the three places where a student could most easily use AI to bypass the intended thinking. Then I'll ask you to revise the assignment to close those gaps — but wait for me to confirm before you do that.`},
    ],
    tryIt:`Upload or paste your assignment into the AI tool first, then try the role reversal prompt. Reading a student's AI-assisted strategy for your own assignment often reveals design vulnerabilities instantly.`,
    insightPrompt:`What did the student perspective reveal? Where did you see the biggest gaps between your intent and what the assignment actually requires?`
  },
  {
    id:'scope',title:'Scope of integration',
    purpose:'Decide where AI fits — a single task, a critique, an assessment, or a whole project.',
    docTip:null,
    why:`AI integration isn't all-or-nothing. The decision of <strong>where</strong> in a course or assignment to bring AI in is as important as the decision of <strong>whether</strong> to. Different scopes produce very different learning experiences and risks.`,
    prompts:[
      {tag:'starter',    text:`Considering all of the capabilities of generative AI systems today, help me think through the different scopes at which I could integrate AI into my course: a single task or step within an assignment, a full assignment, a critique or peer-review activity, a formal assessment, or an entire project or unit. What are the tradeoffs of integrating AI at each of those levels?`},
      {tag:'flipped',    text:`I'm trying to decide at what level to integrate AI into my course — whether at the level of a single task, a whole assignment, a critique activity, a high-stakes assessment, or an entire project. I'd like you to help me think this through by asking me one question at a time. Wait for my answer before asking the next. Use my responses to help me discover the right scope for my context. Don't offer recommendations until I've worked through the reasoning myself. Begin with your first question now.`},
      {tag:'constraint', text:`Help me think through AI integration in my course, but you must respond only in terms of concrete tradeoffs — for every benefit you name, you must immediately name a corresponding cost or risk. Do not offer net recommendations. Present only the tension. Here is my course context: [describe your course and what you're considering].`},
    ],
    tryIt:`Try the constraint prompt to force a balanced view — it stops the AI from defaulting to enthusiasm. Then use the flipped prompt to work through your actual decision conversationally.`,
    insightPrompt:`Which scope of integration felt most promising — and which felt riskiest? What did working through it reveal?`
  },
  {
    id:'capability',title:'AI capability matrix',
    purpose:'Determine whether AI is being used for the right kinds of work.',
    docTip:null,
    why:`AI tools are genuinely strong at some tasks — brainstorming, drafting, explaining, giving feedback — and unreliable for others. Knowing the difference helps you design smarter, safer integration.`,
    prompts:[
      {tag:'starter',   text:`Considering all of the capabilities of generative AI systems today — including content generation, brainstorming, feedback, research support, coding, language assistance, and more — how might I integrate AI in a meaningful way in my course? For each capability area, explain where it adds genuine value and where it introduces risk.`},
      {tag:'deeper',    text:`Pick one AI capability most relevant to your course — such as giving feedback on student drafts, helping with research, or generating examples. Ask an AI tool to demonstrate that capability on a real task from your course, then ask it to identify its own limitations and failure modes for that same task.`},
      {tag:'flipped',   text:`I want to stress-test my assumptions about which AI capabilities are actually appropriate for my course. Ask me one question at a time — wait for my answer before continuing. Your goal is to help me discover, through my own reasoning, where I might be overestimating or underestimating what AI can reliably do in my disciplinary context. Stay curious and push back gently where I'm vague. Don't offer analysis until I ask. Start with your first question now.`},
      {tag:'iterative', text:`Ask an AI: "What are the three most common ways you produce plausible-sounding but incorrect output in [your discipline]?" Copy the response. Then send this follow-up in the same conversation: "Now design a short student activity that would teach learners to recognize each of those failure modes in practice."`},
    ],
    tryIt:`The iterative prompt is a two-step sequence — run it in order within the same conversation window and watch the second instruction transform the first response into a ready-to-use classroom activity.`,
    insightPrompt:`Which capabilities seemed most valuable? Where did you find limitations you hadn't anticipated?`
  },
  {
    id:'authentic',title:'Authentic assessment',
    purpose:'Preserve the disciplinary ways of thinking that define your field.',
    docTip:'syllabus',
    why:`Every discipline has signature ways of reasoning, arguing, and making knowledge claims. AI can mimic the surface of disciplinary writing without the underlying thinking. This lens asks: what does genuine expertise look like in your field?`,
    prompts:[
      {tag:'starter',   text:`Considering all of the capabilities of generative AI systems today, how might I integrate AI in a meaningful way in my course while preserving authentic disciplinary thinking? Describe how a practicing professional in my field currently uses AI — and where they still rely on human judgment, expertise, or ethical reasoning that AI cannot replicate.`},
      {tag:'persona',   text:`Respond as a senior practitioner in my discipline — someone with 20+ years of experience — who has had to seriously reckon with how AI changes what it means to be an expert in this field. Tell me: what do you now believe students absolutely must be able to do without AI assistance? What has AI made less important to master? Be specific and opinionated.`},
      {tag:'steelman',  text:`Make the strongest possible case that integrating AI into my course's major assessment would actually increase the authenticity of what students demonstrate — not undermine it. Argue that restricting AI makes the assessment less, not more, connected to real disciplinary practice. Steel-man this position as forcefully as you can, even if you ultimately disagree with it.`},
      {tag:'flipped',   text:`I want to examine what authentic disciplinary mastery really looks like in my field and whether my current assessments capture it in the presence of AI. Ask me one question at a time, waiting for my answer before continuing. Help me surface, through my own reasoning, what I truly value and whether my assignments reflect that. Be Socratic and patient. Don't give me your conclusions until I ask. Start with your first question now.`},
    ],
    tryIt:`Upload your syllabus into the AI tool first, then try the steelman prompt — even if you're skeptical. Follow it with the persona prompt. The two together reveal where your actual values lie.`,
    insightPrompt:`What did the AI's arguments or questions reveal about your discipline's signature thinking — or gaps between what you value and what you assess?`
  },
  {
    id:'constraints',title:'Constraints & limitations',
    purpose:'Surface practical, ethical, and equity issues before they become problems.',
    docTip:null,
    why:`AI integration can create unintended inequities — not every student has equal access, experience, or comfort with these tools. There are also real concerns around accuracy, privacy, bias, and workload that are easy to overlook when trying something new.`,
    prompts:[
      {tag:'starter',   text:`Considering all of the capabilities of generative AI systems today, how might I integrate AI in a meaningful way in my course — and what are the most important constraints and limitations I should think through first? Cover accuracy and hallucination risks, student privacy, equity of access, bias in AI outputs, and sustainability for me as an instructor.`},
      {tag:'flipped',   text:`I want to identify the real constraints and equity concerns in an AI integration plan I'm developing — but I want to discover them myself rather than receive a list. Ask me one question at a time about my course context, my students, and my plan. Wait for my answer before continuing. Use my responses to help me surface risks I might be overlooking. Don't summarize until I ask. Start with your first question now.`},
      {tag:'persona',   text:`Respond as a disability services advisor and accessibility specialist at a university. I'm considering asking all students to use AI tools as part of a course assignment. Tell me: what concerns would you bring to my attention before I finalize this plan? What questions would you want me to answer before you'd consider this equitable for all students?`},
      {tag:'steelman',  text:`Make the strongest possible case that NOT integrating AI into my course is itself an equity problem — that by keeping AI out, I am disadvantaging students who need AI fluency for their careers and failing to prepare them for the world they're entering. Argue this as forcefully as you can.`},
    ],
    tryIt:`The persona prompt here is particularly valuable — an accessibility lens surfaces concerns that a generic equity question often misses. Try it before you finalize any integration plan.`,
    insightPrompt:`What risks or equity issues came up that you hadn't fully considered? What might you do differently?`
  },
  {
    id:'literacy',title:'Critical AI literacy',
    purpose:'Help students become thoughtful evaluators of AI — not just users.',
    docTip:null,
    why:`One of the most transferable skills students can develop right now is how to critically interrogate AI outputs: spot hallucinations, detect bias, understand limitations, and make informed decisions about when to trust AI and when not to.`,
    prompts:[
      {tag:'starter',    text:`Considering all of the capabilities of generative AI systems today, how might I integrate AI in a meaningful way in my course that also helps students become critical, reflective users of AI — not just consumers of its outputs? Suggest learning activities where students actively evaluate, question, and push back on AI responses.`},
      {tag:'reversal',   text:`Respond as a student who has just received an AI-generated response to a question in my course and has decided to submit it without checking it. Walk me through your thought process: Why did you trust it? What would have had to be different — in the assignment design, the classroom culture, or the AI's response itself — for you to have questioned it instead?`},
      {tag:'constraint', text:`Design a student activity that builds critical AI literacy, but follow this constraint: the activity cannot involve the instructor demonstrating anything. Students must discover the AI's limitations themselves through their own structured investigation. The activity must take no more than 20 minutes. Here is my course context: [describe your course and student level].`},
      {tag:'iterative',  text:`First, generate a plausible but subtly incorrect AI response to a typical question in my discipline — something that sounds authoritative but contains at least two errors a careful reader would catch. [After it responds, send this follow-up]: Now design a peer-review checklist students could use to identify those kinds of errors in any AI response in this field.`},
    ],
    tryIt:`The iterative prompt builds a ready-to-use classroom activity from a real example of AI error. Run it as a two-step sequence in the same conversation — send the follow-up after you receive the first response.`,
    insightPrompt:`What did you notice when critically evaluating AI responses? What made errors easier or harder to spot?`
  },
  {
    id:'synthesis',title:'Integrated synthesis',
    purpose:'Bring it all together into a concrete recommendation.',
    docTip:null,
    why:`After exploring multiple lenses, patterns emerge — strengths, tensions, and tradeoffs that point toward clearer design decisions. This final lens helps you move from analysis to action.`,
    prompts:[
      {tag:'starter',    text:`Considering all of the capabilities of generative AI systems today, and reflecting on the concerns I've identified around learning objectives, student engagement, scope of integration, AI limitations, authentic assessment, equity, and critical literacy — how might I integrate AI in a meaningful way in my course that honestly accounts for all of those dimensions?`},
      {tag:'steelman',   text:`I've been analyzing an AI integration plan for my course and I'm leaning toward a cautious, limited approach. Make the strongest possible case that I'm being too conservative — that a bolder integration would serve my students better and that my caution is a disservice to them. Then, in the same response, make the strongest case for my caution. Present both sides at full strength.`},
      {tag:'flipped',    text:`I've been exploring several lenses for thinking about AI integration in my course and I'm ready to make a decision — but I want to test my reasoning before I commit. Ask me one question at a time about what I've discovered, what I value, and what I'm still uncertain about. Wait for my answer before continuing. Help me arrive at my own recommendation through the conversation. Don't tell me what to do until I explicitly ask. Start with your first question now.`},
      {tag:'constraint', text:`Help me write a one-paragraph AI integration policy for my course syllabus. Constraint: it must be written so that a first-generation student who has never used AI understands exactly what is expected, and a student who uses AI regularly understands exactly where the limits are. No jargon. Maximum 100 words.`},
    ],
    tryIt:`End with the flipped prompt to synthesize through conversation, then use the constraint prompt to turn your decision into a concrete syllabus statement you can actually use.`,
    insightPrompt:`What is your takeaway? Do you plan to proceed, modify, pilot, or reconsider? What was the most important tension you worked through?`
  }
];

const state={active:0,insights:{}};
let reportMode=false;

function renderNav(){
  const c=document.getElementById('nav-items');
  c.innerHTML='';
  LENSES.forEach((l,i)=>{
    const div=document.createElement('div');
    const isActive=!reportMode&&state.active===i;
    div.className='nav-item'+(isActive?' active':'')+(state.insights[l.id]?' done':'');
    div.innerHTML=`<span class="nav-dot"></span><span>${l.title}</span>`;
    div.onclick=()=>{reportMode=false;state.active=i;render();};
    c.appendChild(div);
  });
  const rpt=document.getElementById('nav-report');
  if(rpt) rpt.className='nav-item'+(reportMode?' active':'');
}

function copyText(btn,text){
  const lbl=btn.dataset.label||'Copy';
  const done=(ok)=>{
    btn.textContent=ok?'Copied!':'Failed';
    if(ok) btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=lbl;btn.classList.remove('copied');},2000);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>legacyCopy(text,done));
  } else legacyCopy(text,done);
}

function legacyCopy(text,done){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0;width:1px;height:1px';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{done(document.execCommand('copy'));}catch(e){done(false);}
  document.body.removeChild(ta);
}

function saveInsight(id){
  const ta=document.getElementById('insight-'+id);
  if(ta&&ta.value.trim()){
    state.insights[id]=ta.value.trim();
    const btn=document.getElementById('save-'+id);
    if(btn){btn.textContent='✓ Saved';setTimeout(()=>{btn.textContent='Save insight';},1800);}
    renderNav();
  }
}

function toolChipsHTML(){
  return TOOLS.map(t=>`<a class="tool-chip" href="${t.url}" target="_blank" rel="noopener noreferrer">${t.name}</a>`).join('');
}

function docTipHTML(key){
  if(!key) return '';
  const d=DOC_TIPS[key];
  return `<div class="doc-tip">
    <div class="doc-tip-icon">${d.icon}</div>
    <div class="doc-tip-body"><h4>${d.title}</h4><p>${d.body}</p></div>
  </div>`;
}

function promptCardHTML(p){
  const m=TAG_META[p.tag];
  const esc=p.text.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$');
  const note=m.note?`<div class="prompt-note"><span>ℹ</span><span>${m.note}</span></div>`:'';
  const special=m.special?' special':'';
  return `<div class="prompt-card${special}">
    <div class="prompt-card-header">
      <span class="prompt-tag ${m.cls}">${m.label}</span>
      <div class="btn-row">
        <button class="copy-btn" data-label="Copy" onclick='copyText(this,\`${esc}\`)'>Copy</button>
      </div>
    </div>
    <div class="prompt-text">${p.text}</div>
    ${note}
  </div>`;
}

function renderLens(idx){
  const l=LENSES[idx];
  const saved=state.insights[l.id]||'';
  return `<div class="lens-panel">
    <div class="lens-header">
      <div class="ln">Lens ${idx+1} of ${LENSES.length}</div>
      <h2>${l.title}</h2>
      <div class="purpose">${l.purpose}</div>
    </div>
    <div class="lens-body">
      <div class="why-box">${l.why}</div>
      ${docTipHTML(l.docTip)}
      <div class="prompts-label">Prompts to try</div>
      <p class="prompts-intro">Copy any prompt and paste it into an AI tool. Darker prompt cards show a specific prompting pattern — each includes a note explaining how and why it works differently.</p>
      ${l.prompts.map(promptCardHTML).join('')}
      <div class="try-it">
        <h4>🚀 Try it</h4>
        <p>${l.tryIt}</p>
        <div class="tool-chips">${toolChipsHTML()}</div>
      </div>
      <div class="insight-section">
        <label>💡 What did you discover?</label>
        <p>${l.insightPrompt} Jot down your key insight — it will appear in your report out.</p>
        <textarea class="insight-textarea" id="insight-${l.id}" placeholder="Type your insight here...">${saved}</textarea>
        <button class="save-btn" id="save-${l.id}" onclick="saveInsight('${l.id}')">Save insight</button>
      </div>
    </div>
  </div>
  <div class="nav-footer">
    <button class="nav-btn" onclick="goTo(${idx-1})" ${idx===0?'disabled':''}>← Previous</button>
    ${idx<LENSES.length-1
      ?`<button class="nav-btn primary" onclick="goTo(${idx+1})">Next lens →</button>`
      :`<button class="nav-btn primary" onclick="showReport()">📋 See report out</button>`}
  </div>`;
}

function renderReport(){
  const completed=LENSES.filter(l=>state.insights[l.id]);
  const pct=Math.round(completed.length/LENSES.length*100);
  let html=`<div class="prog-bar-wrap">
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <span class="prog-label">${completed.length} of ${LENSES.length} lenses explored</span>
  </div>
  <div class="copy-all-hint">✂️ <strong>Ready to post to Canvas?</strong> Click "Copy all for Canvas" to copy your saved insights as formatted text, then paste directly into your Canvas discussion post.</div>
  <div class="report-card">
    <div class="report-head">
      <span>Your insights</span>
      <button class="report-copy-btn" id="copy-all-btn" onclick="copyAllInsights()">Copy all for Canvas</button>
    </div>
    <div class="report-body">`;
  if(!completed.length){
    html+=`<div class="empty-report">No insights saved yet.<br>Explore some lenses and save your discoveries.</div>`;
  } else {
    completed.forEach(l=>{
      html+=`<div class="report-item">
        <div class="report-lens-name">Lens ${LENSES.indexOf(l)+1}: ${l.title} <span style="font-weight:400;color:#888;font-size:12px">— ${l.purpose}</span></div>
        <div class="report-insight">${state.insights[l.id]}</div>
      </div>`;
    });
  }
  html+=`</div></div>
  <div class="nav-footer">
    <button class="nav-btn" onclick="state.active=0;reportMode=false;render()">← Back to lenses</button>
  </div>`;
  return html;
}

function copyAllInsights(){
  const completed=LENSES.filter(l=>state.insights[l.id]);
  if(!completed.length){alert('No insights saved yet. Explore some lenses first!');return;}
  let text='Summer AI Studio — 8 Lenses Reflection\n'+'='.repeat(42)+'\n\n';
  completed.forEach(l=>{
    text+=`${l.title.toUpperCase()}\n${l.purpose}\n\n${state.insights[l.id]}\n\n${'-'.repeat(38)}\n\n`;
  });
  text=text.trim();
  const btn=document.getElementById('copy-all-btn');
  const done=(ok)=>{
    btn.textContent=ok?'✓ Copied!':'Failed — select text manually';
    if(ok) btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy all for Canvas';btn.classList.remove('copied');},3000);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>legacyCopy(text,done));
  } else legacyCopy(text,done);
}

function goTo(idx){
  state.active=Math.max(0,Math.min(LENSES.length-1,idx));
  reportMode=false;render();window.scrollTo({top:0,behavior:'smooth'});
}
function showReport(){reportMode=true;render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){renderNav();document.getElementById('main-content').innerHTML=reportMode?renderReport():renderLens(state.active);}
render();
</script>
</body>
</html>
